[package]
name = "omnivoice-infer"
# skylar-ai fork on crates.io candle, published to skylar-crates only
version = "0.1.0-skylar-1"
description = "OmniVoice text-to-speech inference on candle (skylar-ai fork of FerrisMind/omnivoice-rs)"
repository = "https://github.com/skylar-ai/omnivoice-rs"
publish = ["skylar-crates"]
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
candle-core.workspace = true
candle-nn.workspace = true
candle-transformers.workspace = true
candle-flash-attn = { workspace = true, optional = true }
fslock.workspace = true
half.workspace = true
hound.workspace = true
hf-hub.workspace = true
regex.workspace = true
safetensors.workspace = true
serde.workspace = true
serde_json.workspace = true
strsim.workspace = true
symphonia.workspace = true
thiserror.workspace = true
tokenizers.workspace = true
rand.workspace = true
mistralrs-audio = { workspace = true, optional = true }
unicode-general-category.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { workspace = true, features = ["metal"] }
candle-nn = { workspace = true, features = ["metal"] }
candle-transformers = { workspace = true, features = ["metal"] }

[features]
default = []
audio-helper = ["dep:mistralrs-audio"]
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda", "dep:candle-flash-attn"]
metal = []
phase6-tests = []
